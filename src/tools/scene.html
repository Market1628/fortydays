<!doctype html>
<!--
  40 Days : aperçu de la scène 3D seule, avec un curseur de progression.
    node src/serve.mjs 8080 --dev   puis   http://127.0.0.1:8080/tools/scene.html?p=0.5
  Paramètres : ?p=0..1 (position du récit), ?rtl (mise en page hébreu).
-->
<html lang="fr"><meta charset="utf-8"><title>40 Days · aperçu de la scène</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #FBF7F2; font: 13px system-ui; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 10px; bottom: 10px; z-index: 2; padding: 8px 10px; border-radius: 10px; background: #fffc; display: flex; gap: 8px; align-items: center; }
  #ui input { width: 320px; }
</style>
<canvas id="c"></canvas>
<div id="ui"><input id="r" type="range" min="0" max="1" step="0.005" value="0"><span id="v">0</span><span id="q"></span></div>
<script type="module">
import { createHomeScene } from '/assets/js/home-scene.js';
const params = new URLSearchParams(location.search);
const scene = createHomeScene({ canvas: document.getElementById('c'), rtl: params.has('rtl'), onHeld: h => console.log('held', h) });
window.S = scene;
scene.start();
const r = document.getElementById('r'), v = document.getElementById('v'), q = document.getElementById('q');
r.oninput = () => { scene.setProgress(+r.value); v.textContent = r.value; };
addEventListener('resize', () => scene.resize());
if (params.has('p')) { r.value = params.get('p'); v.textContent = r.value; scene.snap(+params.get('p')); }
setInterval(() => { q.textContent = 'qualité ' + scene.quality.toFixed(2); }, 1000);
</script>
